<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    :root { color-scheme: light dark; }
    body { width: 240px; margin: 0; padding: 16px; font: 14px/1.4 system-ui, sans-serif; background:#141414; color:#fff; }
    h1 { font-size: 14px; margin: 0 0 10px; font-weight: 700; }
    p { margin: 0 0 14px; color:#b8b8b8; font-size: 12px; }
    button { width: 100%; border: 0; border-radius: 9px; padding: 11px; background:#7c5cff; color:#fff; font: 700 14px system-ui; cursor: pointer; }
    button:hover { filter: brightness(1.08); }
    .ok { margin-top:10px; font-size:12px; color:#6fd08c; min-height:16px; }
  </style>
</head>
<body>
  <h1>🔗 Flashpost</h1>
  <p>Abre o Flashpost e já faz login, Conectar conta e Permitir sozinho.</p>
  <button id="abrir" type="button">Abrir Flashpost</button>
  <div class="ok" id="status"></div>
  <script src="popup.js"></script>
</body>
</html>
